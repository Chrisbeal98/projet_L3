services:
  - type: web
    name: antivol
    runtime: python
    repo: https://github.com/Chrisbeal98/projet_L3
    plan: free
    buildCommand: pip install -r requirements.txt
    # Applique les révisions Alembic AVANT de démarrer le nouveau code.
    # Sans cela, un déploiement qui ajoute une colonne sert une version qui
    # l'interroge, sur une base qui ne l'a pas encore.
    preDeployCommand: flask db upgrade
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_APP
        value: app:create_app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: antivol-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
      # Notifications push
      - key: NTFY_URL
        value: https://ntfy.sh
      # Coller ici le contenu JSON de la cle de service Firebase
      # (parametres du projet > comptes de service > generer une cle)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Le site etant servi en HTTPS, le cookie de session reste en Secure
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: antivol-db
    databaseName: antivol
    plan: free
